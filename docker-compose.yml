version: '3.9'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ludoking-db
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - ludoking_network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ludoking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ludoking_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/LudoKing.API/Dockerfile
    container_name: ludoking-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=LudoKingDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"
      Cors__AllowedOrigins__0: "http://localhost:4200"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ludoking_network

  ui:
    build:
      context: src/LudoKing.UI
      dockerfile: Dockerfile
      args:
        API_URL: "http://localhost:5000"
    container_name: ludoking-ui
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - ludoking_network

volumes:
  sqlserver_data:
  redis_data:

networks:
  ludoking_network:
    driver: bridge
