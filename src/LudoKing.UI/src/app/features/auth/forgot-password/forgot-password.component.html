<div class="card-center">
  <mat-card class="form-card">
    <mat-card-header><mat-card-title>Forgot Password</mat-card-title></mat-card-header>
    <mat-card-content>
      <p *ngIf="sent" style="color:#388e3c">
        If that email is registered, a reset link has been sent. Check your inbox.
      </p>
      <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!sent">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading">
          {{ loading ? 'Sending…' : 'Send Reset Link' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button routerLink="/auth/login">Back to sign in</a>
    </mat-card-actions>
  </mat-card>
</div>
