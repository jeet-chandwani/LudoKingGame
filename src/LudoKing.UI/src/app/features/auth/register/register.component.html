<div class="card-center">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Create Account</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-card class="mat-elevation-z0" style="background:#e8f5e9;padding:12px;margin-bottom:16px" *ngIf="success">
        {{ success }} <a routerLink="/auth/login">Sign in →</a>
      </mat-card>
      <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success">
        <mat-form-field appearance="outline">
          <mat-label>User ID</mat-label>
          <input matInput formControlName="username" autocomplete="username" maxlength="10">
          <mat-hint>Alphanumeric, max 10 characters — used to log in</mat-hint>
          <mat-error *ngIf="form.get('username')?.hasError('pattern')">Alphanumeric only, max 10 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Display Name</mat-label>
          <input matInput formControlName="displayName" autocomplete="nickname">
          <mat-error *ngIf="form.get('displayName')?.hasError('minlength')">Min 3 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
          <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="new-password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>Minimum 8 characters</mat-hint>
        </mat-form-field>

        <div class="error-message" *ngIf="error">{{ error }}</div>

        <button mat-raised-button color="primary" type="submit" [disabled]="loading">
          {{ loading ? 'Creating…' : 'Create Account' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions *ngIf="!success">
      <a mat-button routerLink="/auth/login">Already have an account?</a>
    </mat-card-actions>
  </mat-card>
</div>
