<div class="card-center">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Change Password</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="success" class="success-message">
        Password changed successfully. Redirecting to login&hellip;
      </div>

      <form *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Current Password</mat-label>
          <input matInput [type]="hideCurrentPw ? 'password' : 'text'" formControlName="currentPassword" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="hideCurrentPw = !hideCurrentPw">
            <mat-icon>{{ hideCurrentPw ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('currentPassword')?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>New Password</mat-label>
          <input matInput [type]="hideNewPw ? 'password' : 'text'" formControlName="newPassword" autocomplete="new-password">
          <button mat-icon-button matSuffix type="button" (click)="hideNewPw = !hideNewPw">
            <mat-icon>{{ hideNewPw ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>At least 6 characters</mat-hint>
          <mat-error *ngIf="form.get('newPassword')?.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">At least 6 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Confirm New Password</mat-label>
          <input matInput [type]="hideConfirmPw ? 'password' : 'text'" formControlName="confirmPassword" autocomplete="new-password">
          <button mat-icon-button matSuffix type="button" (click)="hideConfirmPw = !hideConfirmPw">
            <mat-icon>{{ hideConfirmPw ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.hasError('mismatch') && form.get('confirmPassword')?.touched">Passwords do not match</mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="error">{{ error }}</div>

        <div style="display:flex;gap:8px;margin-top:8px">
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            {{ loading ? 'Saving…' : 'Change Password' }}
          </button>
          <a mat-button routerLink="/profile">Cancel</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
